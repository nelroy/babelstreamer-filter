name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: read
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  # No build-project or create-release job: compiling requires a local
  # whisper.cpp checkout (see WHISPER_ROOT in CMakeLists.txt) that this
  # repo's CI has no step to fetch/build, so a compile job can only ever
  # fail here. The build is verified locally instead. Packaging/codesigning/
  # notarizing/release-drafting are handled outside this repo too - see
  # COMPLIANCE.md.
